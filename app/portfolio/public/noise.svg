<svg xmlns="http://www.w3.org/2000/svg" width="1024px" height="1024px">
    <filter id='noiseFilter'>
        <feTurbulence
                type='fractalNoise'
                baseFrequency='0.65'
                numOctaves='4'
                stitchTiles='stitch'
                result="noise"
        />

        <feColorMatrix in="noise" type="saturate" values="0" />
    </filter>

    <rect width='100%' height='100%' filter='url(#noiseFilter)' opacity="0.75" />
</svg>