<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="1000px"
     height="1000px"
     viewBox="200 200 600 600"
>
    <title>Anti-Matter Studios</title>
    <defs>
        <style>.debug { display: none; }</style>
    </defs>
    <g id="Icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="Anti-Matter-Studios">
            <g id="Particles" transform="translate(500, 500)">
                <g id="Top-Right-Particle" transform="translate(-37.5, -112.5)">
                    <path d="M +4 -4 A 150 150 0 1 1 150 150 Z"
                          stroke="hsl(120, 20%, 90%)"
                          stroke-width="24"
                          fill="hsl(120, 10%, 70%)"
                          stroke-linecap="round" />
                </g>
                <g id="Bottom-Left-Particle" transform="translate(+37.5, +112.5), rotate(180)">
                    <path d="M +4 -4 A 150 150 0 1 1 150 150 Z"
                          stroke="hsl(120, 10%, 70%)"
                          stroke-width="24"
                          fill="hsl(120, 20%, 90%)"
                          stroke-linecap="round" />
                </g>
            </g>

            <g id="Separator" transform="translate(250, 250)" stroke-linecap="round" stroke-width="24">
                <line x1="025"
                      y1="000"
                      x2="425"
                      y2="400"
                      id="Bottom-Line"
                      transform="translate(000, 100)"
                      stroke="hsl(120, 10%, 70%)" />
                <line x1="000"
                      y1="025"
                      x2="400"
                      y2="425"
                      id="Top-Line"
                      transform="translate(100, 000)"
                      stroke="hsl(120, 20%, 90%)" />
                <line x1="000"
                      y1="000"
                      x2="500"
                      y2="500"
                      id="Center-Line-Dark"
                      transform="translate(000, 000)"
                      stroke="hsl(120, 10%, 60%)"
                      stroke-dasharray="78.57, 235.71" />
                <line x1="000"
                      y1="000"
                      x2="500"
                      y2="500"
                      id="Center-Line-Light"
                      transform="translate(000, 000)"
                      stroke="hsl(120, 20%, 95%)"
                      stroke-dasharray="78.57, 235.71"
                      stroke-dashoffset="157.14" />
            </g>

            <g id="Particle Effects" transform="translate(500, 500)" stroke-linecap="round" stroke-width="0">
                <g id="Top Particle Effects" stroke="hsl(120, 10%, 60%)" transform="translate(40, -40)">
                    <g id="Top Particle Effects - Left Element" transform="translate(-75, -75)">
                        <line x1="0"
                              y1="-100"
                              x2="0"
                              y2="-150"
                              transform="rotate(-12)"
                              id="Top Particle Effects - Line #1" />
                        <line x1="0"
                              y1="-050"
                              x2="0"
                              y2="-125"
                              transform="rotate(-25)"
                              id="Top Particle Effects - Line #2" />
                    </g>
                    <g id="Top Particle Effects - Right Element" transform="translate(+75, +75), rotate(90)">
                        <line x1="0"
                              y1="-100"
                              x2="0"
                              y2="-150"
                              transform="rotate(+12)"
                              id="Top Particle Effects - Line #3" />
                        <line x1="0"
                              y1="-050"
                              x2="0"
                              y2="-125"
                              transform="rotate(+25)"
                              id="Top Particle Effects - Line #4" />
                    </g>
                </g>
                <g id="Bottom Particle Effects" stroke="hsl(120, 20%, 95%)" transform="translate(-40, +40)">
                    <g id="Bottom Particle Effects - Left Element" transform="translate(-75, -75), rotate(270)">
                        <line x1="0"
                              y1="-100"
                              x2="0"
                              y2="-150"
                              transform="rotate(+12)"
                              id="Bottom Particle Effects - Line #1" />
                        <line x1="0"
                              y1="-050"
                              x2="0"
                              y2="-125"
                              transform="rotate(+25)"
                              id="Bottom Particle Effects - Line #2" />
                    </g>
                    <g id="Bottom Particle Effects - Right Element" transform="translate(+75, +75), rotate(180)">
                        <line x1="0"
                              y1="-100"
                              x2="0"
                              y2="-150"
                              transform="rotate(-12)"
                              id="Bottom Particle Effects - Line #3" />
                        <line x1="0"
                              y1="-050"
                              x2="0"
                              y2="-125"
                              transform="rotate(-25)"
                              id="Bottom Particle Effects - Line #4" />
                    </g>
                </g>
            </g>
        </g>
    </g>
    <style>@media (prefers-color-scheme: light) { :root { filter: none; } }
        @media (prefers-color-scheme: dark) { :root { filter: none; } }
    </style>
</svg>